<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Pagina Non Trovata | Tesfaye Venieri</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        :root {
            --bg-main: #0C0B09;
            --color-primary: #C89B3C;
            --color-primary-light: #D4A84B;
            --color-white: #ffffff;
            --text-secondary: #A89F96;
            --font-body: 'Jost', 'Helvetica Neue', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-main);
            color: var(--color-white);
            font-family: var(--font-body);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        .container {
            padding: 2rem;
            animation: fadeIn 0.5s ease-out;
        }

        h1 {
            font-size: 8rem;
            margin: 0;
            background: linear-gradient(135deg, var(--color-white) 0%, var(--color-primary) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            font-weight: 300;
            color: var(--text-secondary);
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: var(--color-primary);
            color: var(--color-white);
            text-decoration: none;
            border-radius: var(--radius-sm, 50px);
            font-weight: 600;
            font-family: var(--font-body);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(200, 155, 60, 0.5);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>404</h1>
        <h2>Pagina Non Trovata</h2>
        <p>Sembra che tu ti sia perso nel codice. La pagina che stai cercando non esiste o è stata spostata.</p>
        <a href="/" class="btn">Torna alla Home</a>
    </div>
</body>

</html>
