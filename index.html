    <style>
        body { background-color: #0C0B09; margin: 0; }
        [data-theme="light"] body { background-color: #FAF7F2; }
    </style>

    <!-- Theme init: run before CSS to prevent flash of wrong theme -->
    <script>
        (function () {
            var saved = localStorage.getItem('portfolio-theme');
            var preferLight = window.matchMedia('(prefers-color-scheme: light)').matches;
            var theme = saved || (preferLight ? 'light' : 'dark');
            document.documentElement.setAttribute('data-theme', theme);
            if (theme === 'light') document.body && (document.body.style.backgroundColor = '#FAF7F2');
        })();
    </script>

    <!-- SEO Open Graph (Facebook/LinkedIn) -->
    <meta property="og:title" content="Tesfaye Venieri | Portfolio - Coding the Future with Hope">

        content="Studente di Informatica per il Management @ UniBo | Full-Stack Developer & Business Strategist">
